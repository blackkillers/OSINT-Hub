services:
  postgres:
    image: postgres:16-alpine
    container_name: osint_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-osint_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osint_secure_pass_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-osint_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init_db.sql:/docker-entrypoint-initdb.d/init_db.sql:ro
    networks:
      - osint_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-osint_user} -d ${POSTGRES_DB:-osint_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: osint_redis
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning --requirepass ${REDIS_PASSWORD:-redis_secure_pass}
    volumes:
      - redis_data:/data
    networks:
      - osint_net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  tor:
    image: osminogin/tor-simple:latest
    container_name: osint_tor_proxy
    restart: unless-stopped
    networks:
      - osint_net
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 9050 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: osint_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - osint_net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: osint_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-osint_user}:${POSTGRES_PASSWORD:-osint_secure_pass_change_me}@postgres:5432/${POSTGRES_DB:-osint_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/1
      - OLLAMA_HOST=http://ollama:11434
      - TOR_SOCKS_PROXY=socks5://tor:9050
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "0.0.0.0:8000:8000"
    networks:
      - osint_net

  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: osint_celery_worker
    restart: unless-stopped
    command: celery -A app.worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-osint_user}:${POSTGRES_PASSWORD:-osint_secure_pass_change_me}@postgres:5432/${POSTGRES_DB:-osint_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/1
      - OLLAMA_HOST=http://ollama:11434
      - TOR_SOCKS_PROXY=socks5://tor:9050
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - osint_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://173.212.255.158:8000
        NEXT_PUBLIC_WS_URL: ws://173.212.255.158:8000
    container_name: osint_frontend
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://173.212.255.158:8000
      - NEXT_PUBLIC_WS_URL=ws://173.212.255.158:8000
    depends_on:
      - backend
    ports:
      - "0.0.0.0:3000:3000"
    networks:
      - osint_net

networks:
  osint_net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:
